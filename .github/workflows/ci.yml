name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-codigo:
    name: Lint, tests y dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (formato)
        run: ruff format --check src tests

      - name: Actionlint (validación de workflows)
        run: actionlint .github/workflows/*.yml

      # Sin DATABASE_URL: los tests de integración se omiten solos
      - name: Pytest (unitarios)
        run: pytest -v

      - name: Caché de paquetes dbt
        uses: actions/cache@v6
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}

      # dbt parse valida SQL/Jinja/YAML del proyecto sin conectarse a la base.
      # El perfil exige variables de conexión: se usan valores ficticios.
      - name: dbt deps + parse
        env:
          DBT_HOST: localhost
          DBT_USER: ci
          DBT_PASSWORD: ci
          DBT_DBNAME: ci
        run: |
          cd dbt
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .
